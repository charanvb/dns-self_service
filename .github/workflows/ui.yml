name: ui

on:
  push:
    branches: [main]
    paths: ["ui/**", "shared/**"]
  workflow_dispatch: {}

env:
  IMAGE: europe-west4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dns-self-service/ui

jobs:
  deploy:
    name: build, push & deploy UI
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: configure docker auth
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet

      - name: build image
        run: docker build -f ui/Dockerfile -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: deploy to Cloud Run
        run: |
          gcloud run deploy dns-self-service-ui \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }}
