name: terraform-import-existing-secrets

# One-off, manually triggered workflow to bring Secret Manager secrets that were
# created by hand (via Console) under Terraform management. Safe to re-run —
# it skips any secret already present in state.
on:
  workflow_dispatch: {}

env:
  TF_WORKING_DIR: terraform/environments/dev

jobs:
  import:
    name: terraform import
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}/dev"

      - name: import pre-existing secrets
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          for secret_id in db-connection-string micetro-api-username micetro-api-password; do
            addr="module.secret_manager.google_secret_manager_secret.this[\"${secret_id}\"]"
            if terraform state list | grep -Fxq "${addr}"; then
              echo "skip ${secret_id}: already in state"
            else
              terraform import \
                -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
                -var="region=${{ vars.GCP_REGION }}" \
                "${addr}" "projects/${{ vars.GCP_PROJECT_ID }}/secrets/${secret_id}"
            fi
          done
