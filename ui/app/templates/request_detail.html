{% extends "base.html" %}
{% block title %}Request #{{ request_id }} — DNS Self-Service{% endblock %}
{% block body %}
<div class="topbar">
  <div class="brand"><span class="logo-dot"></span> DNS Self-Service</div>
  <div class="user-menu">
    <span>{{ username }}</span>
    <button id="logout-btn">Logout</button>
  </div>
</div>

<div class="page">
  <a class="back-link" href="/requests">&larr; Back to my requests</a>
  <h1 class="welcome">Request #{{ request_id }}</h1>
  <div id="content"></div>
</div>

<script src="/static/js/record-types.js"></script>
<script>
async function load() {
  const res = await fetch("/api/requests/{{ request_id }}");
  const el = document.getElementById("content");
  if (!res.ok) {
    el.innerHTML = `<div class="empty-state">Request not found.</div>`;
    return;
  }
  const r = await res.json();
  const myRoles = {{ roles | tojson }};
  const canDecide = r.approval_status === "PENDING"
    && (myRoles.includes("ZONE_ADMIN") || myRoles.includes("CLOUDOPS_ADMIN"));
  const rows = r.items.map(i => {
    const kvs = [`<span class="kv"><b>TTL</b> <span class="val">${i.ttl ?? ""}</span></span>`];
    if (i.action === "DELETE") {
      kvs.push(`<span class="kv"><b>Value</b> <span class="val">${i.previous_value ?? ""}</span></span>`);
    } else {
      Object.entries(i.value || {}).forEach(([k, v]) => {
        kvs.push(`<span class="kv"><b>${fieldLabel(i.record_type, k)}</b> <span class="val">${v}</span></span>`);
      });
      if (i.action === "MODIFY" && i.previous_value) {
        kvs.push(`<span class="kv"><b>Was</b> <span class="val">${i.previous_value}</span></span>`);
      }
    }
    return `
    <div class="review-item">
      <div class="details">
        <div class="details-head">
          <span class="action-badge ${i.action.toLowerCase()}">${i.action}</span>
          <span class="record-type-badge" data-type="${i.record_type}">${i.record_type}</span>
          <span class="details-fqdn">${i.fqdn}</span>
        </div>
        <div class="details-fields">${kvs.join("")}</div>
      </div>
      <span class="status-badge ${i.status}">${i.status}</span>
    </div>`;
  }).join("");
  el.innerHTML = `
    <div class="panel">
      <p><span class="status-badge ${r.status}">${r.status.replace("_"," ")}</span></p>
      ${r.justification ? `<p class="hint">${r.justification}</p>` : ""}
      ${canDecide ? `
      <div class="approval-actions">
        <button id="approve-btn" class="btn btn-primary">Approve</button>
        <button id="reject-btn" class="btn btn-secondary">Reject</button>
      </div>` : ""}
      <h2>Changes</h2>
      ${rows}
    </div>`;

  if (canDecide) {
    document.getElementById("approve-btn").addEventListener("click", async () => {
      if (!confirm("Approve this request?")) return;
      await fetch(`/api/approvals/${r.approval_request_id}/approve`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}),
      });
      load();
    });
    document.getElementById("reject-btn").addEventListener("click", async () => {
      const reason = prompt("Reason for rejection (optional):") || "";
      await fetch(`/api/approvals/${r.approval_request_id}/reject`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason }),
      });
      load();
    });
  }
}
document.getElementById("logout-btn").addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST" });
  window.location.href = "/login";
});
load();
</script>
{% endblock %}
